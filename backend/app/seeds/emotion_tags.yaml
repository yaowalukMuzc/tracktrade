  - {code: hesitant,      label_th: ลังเล,         label_en: Hesitant,       valence: neg}
  - {code: impatient,     label_th: ใจร้อน,       label_en: Impatient,      valence: neg}
  - {code: overconfident, label_th: มั่นใจเกินไป,  label_en: Overconfident,  valence: neg}
