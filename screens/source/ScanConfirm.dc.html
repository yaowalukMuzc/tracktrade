<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Screenshot scan — confirm</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tracktrade/tokens.css">
<link rel="stylesheet" href="ds/tracktrade/components/bundle.css">
<link rel="stylesheet" href="icons.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}" style="height: 1350px">
  <div class="tt-appbar"><a href="ManualTrade.dc.html" class="tt-iconbtn" style="border: 0" aria-label="ย้อนกลับ"><span class="i i-arrow-left-01"></span></a><h1 class="tt-appbar__title">ตรวจข้อมูลจากภาพ</h1></div>
  <div class="scr__body">
    <div style="display: flex; gap: 12px; align-items: center">
      <div style="width: 72px; height: 96px; border-radius: var(--radius-md); background: var(--surface-sunken); border: 1px solid var(--border); display: grid; place-items: center; color: var(--ink-subtle); flex: none"><span class="i i-lg i-image-01"></span></div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span class="body-strong">IMG_4821.PNG</span>
        <span class="caption tt-muted">1.8 MB · อ่านเสร็จใน 6 วินาที</span>
        <span class="tt-badge tt-badge--profit" style="align-self: flex-start"><span class="i i-sm i-checkmark-circle-02"></span>อ่านได้ 9 / 11 ฟิลด์</span>
      </div>
    </div>
    <div class="tt-alert tt-alert--warning" style="font-size: 13px; line-height: 20px"><span class="i i-alert-02"></span><div><span class="tt-alert__title">2 ฟิลด์ความมั่นใจต่ำ</span><span class="tt-alert__body">ตรวจช่องที่ไฮไลต์ก่อนยืนยัน — ระบบจะไม่บันทึกจนกว่าคุณกดยืนยัน</span></div></div>

    <div class="tt-card tt-stack">
      <div class="grid2">
        <div class="tt-field"><label class="tt-label" for="a1">Symbol</label><input class="tt-input" id="a1" value="XAUUSD"></div>
        <div class="tt-field"><span class="tt-label">Direction</span><div class="tt-seg tt-seg--block"><button class="tt-seg__item tt-seg__item--on" style="color: var(--profit-ink)">LONG</button><button class="tt-seg__item">SHORT</button></div></div>
        <div class="tt-field"><label class="tt-label" for="a2">Lot</label><input class="tt-input tt-input--num tt-input--lowconf" id="a2" value="0.13"><span class="tt-help tt-help--warn">มั่นใจ 62%</span></div>
        <div class="tt-field"><label class="tt-label" for="a3">Entry</label><input class="tt-input tt-input--num" id="a3" value="4,352.40"></div>
        <div class="tt-field"><label class="tt-label" for="a4">SL</label><input class="tt-input tt-input--num" id="a4" value="4,344.71"></div>
        <div class="tt-field"><label class="tt-label" for="a5">TP</label><input class="tt-input tt-input--num" id="a5" value="4,392.20"></div>
        <div class="tt-field"><label class="tt-label" for="a6">Exit</label><input class="tt-input tt-input--num" id="a6" value="4,392.19"></div>
        <div class="tt-field"><label class="tt-label" for="a7">Net P/L</label><input class="tt-input tt-input--num" id="a7" value="+517.30"></div>
        <div class="tt-field"><label class="tt-label" for="a8">เปิด</label><input class="tt-input tt-input--lowconf" id="a8" value="8 ก.ย. 07:15"><span class="tt-help tt-help--warn">ไม่พบ timezone — ใช้ UTC+7</span></div>
        <div class="tt-field"><label class="tt-label" for="a9">ปิด</label><input class="tt-input" id="a9" value="8 ก.ย. 11:40"></div>
      </div>
    </div>

    <div class="tt-card">
      <div class="kv"><span>R-multiple (คำนวณ)</span><b class="tt-pnl tt-pnl--up">+5.17R</b></div>
      <div class="kv"><span>แหล่งที่มา</span><b><span class="tt-badge tt-badge--outline">OCR</span></b></div>
      <div class="kv"><span>แนบภาพต้นฉบับ</span><b>ใช่</b></div>
    </div>
    <div class="tt-field"><label class="tt-label" for="pl">ผูกกับแผน</label><select class="tt-select" id="pl"><option>เลือกภายหลัง (เข้าคิวจับคู่)</option></select></div>
  </div>
  <div class="scr__foot"><button class="tt-btn tt-btn--secondary tt-btn--lg" style="flex: 1">สแกนใหม่</button><button class="tt-btn tt-btn--primary tt-btn--lg" style="flex: 1.4"><span class="i i-tick-02"></span>ยืนยันและบันทึก</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
