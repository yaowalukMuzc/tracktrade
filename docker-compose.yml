# TrackTrade dev stack: postgres 17, redis 7, api (FastAPI), worker (arq), web (Vue PWA behind nginx).
#   cp .env.example .env   # optional — defaults below work for local use
#   docker compose up --build
#   open http://localhost:8080
# For hot-reload frontend work run `npm run dev` in frontend/ instead (Vite proxies /api to localhost:8000).
name: tracktrade

x-backend-env: &backend-env
  ENV: ${ENV:-dev}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracktrade}:${POSTGRES_PASSWORD:-tracktrade}@postgres:5432/${POSTGRES_DB:-tracktrade}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10/min}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracktrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracktrade}
      POSTGRES_DB: ${POSTGRES_DB:-tracktrade}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: ./backend
    command: ["/app/scripts/start-worker.sh"]
    environment: *backend-env
    depends_on:
      api: { condition: service_healthy } # api applies migrations + seeds first
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    # Build context is the repo root: the frontend imports ../design-system (single source of tokens).
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
