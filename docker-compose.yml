# TrackTrade dev stack: postgres 17, redis 7, auth (Better Auth), api (FastAPI), worker (arq),
# web (Vue PWA behind nginx), mailpit (catches reset-password emails).
#   cp .env.example .env   # optional — defaults below work for local use
#   docker compose up --build
#   open http://localhost:8080          (emails: http://localhost:8025)
# For hot-reload frontend work run `npm run dev` in frontend/ instead
# (Vite proxies /api/auth to localhost:3000 and /api to localhost:8000).
name: tracktrade

x-backend-env: &backend-env
  ENV: ${ENV:-dev}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracktrade}:${POSTGRES_PASSWORD:-tracktrade}@postgres:5432/${POSTGRES_DB:-tracktrade}
  REDIS_URL: redis://redis:6379/0
  AUTH_JWKS_URL: http://auth:3000/api/auth/jwks
  JWT_ISSUER: ${JWT_ISSUER:-tracktrade-auth}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-tracktrade-api}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5179}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MEDIA_ROOT: /data/media
  APP_URL: ${APP_URL:-http://localhost:8080}
  MT5_EA_DIR: /app/connectors/mt5-ea
  # cTrader linking stays off until these are set (https://openapi.ctrader.com/apps).
  FERNET_KEY: ${FERNET_KEY:-}
  CTRADER_CLIENT_ID: ${CTRADER_CLIENT_ID:-}
  CTRADER_CLIENT_SECRET: ${CTRADER_CLIENT_SECRET:-}
  CTRADER_REDIRECT_URI: ${CTRADER_REDIRECT_URI:-http://localhost:8080/api/v1/connections/ctrader/callback}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracktrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracktrade}
      POSTGRES_DB: ${POSTGRES_DB:-tracktrade}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  auth:
    build: ./auth
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracktrade}:${POSTGRES_PASSWORD:-tracktrade}@postgres:5432/${POSTGRES_DB:-tracktrade}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-better-auth-secret-change-me-0123456789}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUSTED_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5179}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_ISSUER: ${JWT_ISSUER:-tracktrade-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tracktrade-api}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10/min}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-TrackTrade <no-reply@tracktrade.local>}
    depends_on:
      api: { condition: service_healthy } # api applies the migrations that create auth_* tables
      mailpit: { condition: service_started }
    ports:
      - "${AUTH_PORT:-3000}:3000"

  api:
    build: ./backend
    environment: *backend-env
    volumes:
      - media:/data/media # uploaded images (playbook examples, later reviews/OCR)
      - ./connectors/mt5-ea:/app/connectors/mt5-ea:ro # served as GET /downloads/mt5-ea
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: ./backend
    command: ["/app/scripts/start-worker.sh"]
    environment: *backend-env
    depends_on:
      api: { condition: service_healthy } # api applies migrations + seeds first
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ctrader-stream:
    # Live cTrader execution events (F-08 AC2). Idles when CTRADER_CLIENT_ID / FERNET_KEY are empty.
    build: ./backend
    command: ["python", "-m", "app.modules.connections.ctrader.stream"]
    environment: *backend-env
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    # Build context is the repo root: the frontend imports ../design-system (single source of tokens).
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api: { condition: service_healthy }
      auth: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
  media:
