# Symbol specifications (F-03). Brokers may differ -> per-account overrides (Phase 2).
# FX: non-JPY quote = 5 digits, point 0.00001, pip 0.0001; JPY quote = 3 digits, point 0.001, pip 0.01.
# Standard lot = 100,000 base units. XAUUSD lot = 100 oz, XAGUSD lot = 5,000 oz.
